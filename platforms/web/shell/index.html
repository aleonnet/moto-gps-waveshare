<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="" />
    <link rel="manifest" href="./manifest.webmanifest?v=20260902-live1" />
    <link rel="stylesheet" href="./styles.css?v=20260905-realmap1" />
    <title>MOTO GPS</title>
    <script src="./i18n/messages.js?v=20261019-i18n1" defer></script>
    <script src="./i18n.js?v=20261019-i18n1" defer></script>
    <script src="./map-scene-overlay.js?v=20260905-realmap1" defer></script>
    <script src="./app.js?v=20260905-realmap1" defer></script>
    <script src="./wasm-loader.js?v=20260904-realroute3" defer></script>
  </head>
  <body data-view="setup">
    <div class="app-shell">
      <header class="app-bar">
        <button class="brand" id="home-button" type="button" data-i18n-attr="aria-label:web.home.back">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span><b>MOTO GPS</b><small>PHONE NAV / 01</small></span>
        </button>
        <button class="system-state" id="system-state" type="button" data-i18n-attr="aria-label:web.system.open">
          <i aria-hidden="true"></i>
          <span><b id="system-state-label" data-i18n="web.system.checking"></b><small id="system-state-detail" data-i18n="web.system.checking_detail"></small></span>
        </button>
      </header>

      <main>
        <section class="view setup-view" id="setup-view" aria-labelledby="setup-title">
          <div class="setup-heading">
            <p class="eyebrow" data-i18n="web.setup.eyebrow"></p>
            <h1 id="setup-title" data-i18n="web.setup.title"></h1>
            <p data-i18n="web.setup.intro"></p>
          </div>

          <section class="location-card" id="location-card" aria-labelledby="location-title">
            <span class="location-radar" aria-hidden="true"><i></i></span>
            <div>
              <h2 id="location-title" data-i18n="web.location.title"></h2>
              <p id="location-copy" data-i18n="web.location.copy"></p>
            </div>
            <button id="location-button" type="button" data-i18n="web.location.enable"></button>
          </section>

          <form class="search-form" id="search-form" role="search">
            <label for="destination-query" data-i18n="web.search.label"></label>
            <div class="search-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
              <input id="destination-query" name="keywords" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" data-i18n-attr="placeholder:web.search.placeholder" minlength="2" maxlength="80" disabled />
              <button id="clear-search" class="clear-search" type="button" data-i18n-attr="aria-label:web.search.clear" hidden>×</button>
            </div>
          </form>

          <div class="search-feedback" id="search-feedback" aria-live="polite">
            <span data-i18n="web.search.after_location"></span>
          </div>
          <ol class="place-results" id="place-results" data-i18n-attr="aria-label:web.search.results"></ol>

          <div class="usage-note">
            <span data-i18n="web.usage.title"></span>
            <p data-i18n="web.usage.copy"></p>
          </div>
        </section>

        <section class="view route-view" id="route-view" aria-labelledby="route-title" hidden>
          <button class="back-button" id="route-back" type="button"><span aria-hidden="true">←</span> <span data-i18n="web.route.back"></span></button>
          <div class="route-heading">
            <p class="eyebrow" data-i18n="web.route.eyebrow"></p>
            <h1 id="route-title" data-i18n="web.route.title"></h1>
            <p id="route-destination" data-i18n="web.route.reading_destination"></p>
          </div>

          <div class="instrument instrument--preview">
            <div class="screen-ring">
              <canvas id="canvas" width="466" height="466" data-i18n-attr="aria-label:web.route.canvas"></canvas>
            </div>
          </div>

          <section class="route-summary" data-i18n-attr="aria-label:web.route.summary">
            <div><strong id="route-duration">--</strong><span data-i18n="web.route.duration"></span></div>
            <div><strong id="route-distance">--</strong><span data-i18n="web.route.distance"></span></div>
            <div><strong id="route-traffic">--</strong><span data-i18n="web.route.traffic"></span></div>
          </section>

          <p class="route-status" id="route-status" aria-live="polite" data-i18n="web.route.planning"></p>
          <button class="start-button" id="start-navigation" type="button" disabled>
            <span data-i18n="web.route.start"></span><small data-i18n="web.route.keep_awake"></small>
          </button>
        </section>

        <section class="view navigation-view" id="navigation-view" aria-labelledby="navigation-title" hidden>
          <div class="ride-bar">
            <div><p id="navigation-title" data-i18n="web.ride.navigating"></p><strong id="ride-destination" data-i18n="web.ride.destination"></strong></div>
            <button id="end-navigation" type="button" data-i18n="web.ride.end"></button>
          </div>

          <div class="ride-alert" id="ride-alert" aria-live="assertive" hidden></div>
          <div class="instrument instrument--ride" id="ride-instrument"></div>

          <div class="gesture-note" aria-hidden="true"><span>←</span><b data-i18n="web.ride.swipe"></b><span>→</span></div>

          <section class="ride-stats" data-i18n-attr="aria-label:web.ride.stats">
            <div><span data-i18n="web.ride.remaining"></span><strong id="remaining-distance">--</strong></div>
            <div><span data-i18n="web.ride.arrival"></span><strong id="arrival-time">--:--</strong></div>
            <div><span data-i18n="web.ride.connection"></span><strong id="ride-connection" data-i18n="web.network.online"></strong></div>
          </section>

          <div class="ride-footer">
            <span id="wake-state"><i></i> <span data-i18n="web.ride.awake"></span></span>
            <span id="location-accuracy">GPS -- m</span>
          </div>
        </section>
      </main>
    </div>

    <dialog class="status-dialog" id="status-dialog">
      <form method="dialog">
        <div class="dialog-heading"><b data-i18n="web.status.title"></b><button value="close" data-i18n-attr="aria-label:web.status.close">×</button></div>
        <dl>
          <div><dt data-i18n="web.status.amap"></dt><dd id="dialog-backend" data-i18n="web.system.checking"></dd></div>
          <div><dt data-i18n="web.status.display"></dt><dd id="dialog-runtime" data-i18n="web.status.loading"></dd></div>
          <div><dt data-i18n="web.status.location"></dt><dd id="dialog-location" data-i18n="web.status.not_allowed"></dd></div>
          <div><dt data-i18n="web.status.network"></dt><dd id="dialog-network" data-i18n="web.network.online"></dd></div>
          <div>
            <dt><label for="language-select" data-i18n="web.status.language"></label></dt>
            <dd><select id="language-select"></select></dd>
          </div>
        </dl>
        <p id="language-note" data-i18n="web.status.language_during_ride" hidden></p>
        <p data-i18n="web.status.requirements"></p>
        <p id="credits"></p>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
