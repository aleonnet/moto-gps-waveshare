name: MotoGPS

options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  MotoNavigationCore:
    path: .

targets:
  MotoGPS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - MotoGPS.entitlements
      - path: ../../shared/ble_protocol/src/ble_protocol.cpp
      - path: ../../shared/coordinates/coordinates.cpp
      - path: ../../shared/nav_core/nav_core.cpp
      - path: ../../shared/nav_app/nav_app.cpp
      - path: ../../shared/protocol/fixtures/ble-navigation-v1.golden.txt
        buildPhase: resources
      - path: ../../shared/demo_fixture/jinan_map_scene_sample.json
        buildPhase: resources
      - path: ../../shared/offline_map/jinan-v1.sqlite
        buildPhase: resources
      - path: ../../NOTICE
        buildPhase: resources
      - path: ../../LICENSE.md
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MotoNavigationCore
        product: MotoNavigationCore
      - sdk: libsqlite3.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MOTO GPS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        NSLocationWhenInUseUsageDescription: MOTO GPS needs your location to plan routes and update your ride position.
        NSLocationAlwaysAndWhenInUseUsageDescription: Once navigation starts, MOTO GPS keeps updating your ride position while the screen is locked or you use another app.
        NSBluetoothAlwaysUsageDescription: MOTO GPS uses Bluetooth to connect to the ESP32-S3 round display on the handlebar.
        NSAppleMusicUsageDescription: MOTO GPS reads and controls Apple Music playback so you can change tracks and pause from the round display.
        UIBackgroundModes:
          - location
          - bluetooth-central
        MOTOGPSGatewayBaseURL: https://example.invalid/moto-gps/api/
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/MotoGPS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.motogps
        PRODUCT_NAME: MOTO GPS
        MARKETING_VERSION: 0.3.1
        CURRENT_PROJECT_VERSION: 6
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_OBJC_BRIDGING_HEADER: App/MotoGPS-Bridging-Header.h
        # Xcode extracts interface strings into App/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../../shared/ble_protocol/include
          - $(SRCROOT)/../../shared/coordinates/include
          - $(SRCROOT)/../../shared
          - $(SRCROOT)/../../shared/nav_app/include
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"

  MotoGPSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MotoGPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.motogps.uitests
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: MotoGPS
        GENERATE_INFOPLIST_FILE: YES

  MotoGPSUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
      - path: ../../shared/demo_fixture/jinan_map_scene_sample.json
        buildPhase: resources
    dependencies:
      - target: MotoGPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.motogps.unittests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MOTO GPS.app/MOTO GPS
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MotoGPS:
    build:
      targets:
        MotoGPS: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - MotoGPSUnitTests
        - MotoGPSUITests
